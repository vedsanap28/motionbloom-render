name: Render Video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique job ID for this render'
        required: true
      prompt_data:
        description: 'JSON data with clips, text, music info'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: node render-script.js "${{ github.event.inputs.job_id }}" "${{ github.event.inputs.prompt_data }}"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.event.inputs.job_id }}
          path: output/*.mp4
