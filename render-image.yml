name: Render Image

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique job ID for this render'
        required: true
      prompt_data:
        description: 'JSON data with prompt'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render image
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          PROMPT_DATA: ${{ github.event.inputs.prompt_data }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_IMAGE_API_KEY: ${{ secrets.PEXELS_IMAGE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node render-image.js "$JOB_ID" "$PROMPT_DATA"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.event.inputs.job_id }}
          path: output/*.png
